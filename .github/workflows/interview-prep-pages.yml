name: Deploy interview prep to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "interview-prep/**"
      - ".github/workflows/interview-prep-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: interview-prep

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
